<title>Diwali Gali</title>
<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#070a1f;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:none;text-shadow:0 1px 6px #000}
#top b{font-size:1.4rem;font-weight:800}
#top p{margin:2px 0 0;color:var(--muted);font-size:.8rem;max-width:250px}
#cnt{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:right;pointer-events:none;text-shadow:0 1px 6px #000}
#cnt b{font-size:1.6rem;display:block;line-height:1}#cnt span{color:var(--muted);font-size:.8rem}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);background:var(--ui);padding:8px 14px;border-radius:14px;font-size:.9rem;display:none;pointer-events:none}
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:110px;height:110px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44;touch-action:none}
#knob{position:absolute;left:30px;top:30px;width:46px;height:46px;border-radius:50%;background:#ffb020cc;pointer-events:none}
#act{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:flex;gap:10px}
#act button{width:76px;height:76px;border-radius:50%;background:#ffb020;color:var(--hot-ink);font-weight:800;padding:0}
#act button#bL{background:#ff5a2e}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:6px;align-items:center}
.row{display:flex;gap:6px;background:var(--ui);padding:6px;border-radius:18px;backdrop-filter:blur(8px);max-width:100%;overflow-x:auto;scrollbar-width:none}
button{font:inherit;font-size:.92rem;border:0;border-radius:12px;padding:9px 13px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
button[aria-pressed="true"]{background:var(--hot);color:var(--hot-ink);font-weight:700}
button.act{background:#3a2a5c}
button:focus-visible{outline:3px solid #fff;outline-offset:1px}
</style>
</head>
